name: SAN-1 Guardrail CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
    types:
      - closed

jobs:
  test:
    name: ONNX Integrity & Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for OpenCV & RapidOCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Verify ONNX model suite integrity
        run: |
          san1 verify-models

      - name: Run unit & integrity test suite
        run: |
          pytest -v tests/

  docker:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t san1-guardrail:ci .

      - name: Verify container model suite inside Docker
        run: |
          docker run --rm san1-guardrail:ci san1 verify-models

      - name: Verify text moderation inside Docker
        run: |
          docker run --rm san1-guardrail:ci san1 validate-text "Test text moderation in Docker container"
