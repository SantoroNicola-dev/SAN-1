[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "san1"
version = "1.3.0"
description = "SAN-1: High-Performance Multimodal Content Guardrail with ONNX Two-Tower & Semantic NLP Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VibeProject Engineering"}
]
keywords = ["guardrail", "onnx", "moderation", "selfie", "vision", "nlp", "ocr", "safety"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "tokenizers>=0.20.0",
    "rapidocr-onnxruntime>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
san1 = "s1_vision.cli:main"
san1-server = "s1_vision.server:main"

[tool.setuptools.packages.find]
include = ["s1_vision*"]
