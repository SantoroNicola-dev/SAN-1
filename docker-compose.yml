services:
  san1-guardrail:
    build:
      context: .
      dockerfile: Dockerfile
    image: san1-guardrail:latest
    container_name: san1_service
    ports:
      - "8000:8000"
    environment:
      - SAN1_HOST=0.0.0.0
      - SAN1_PORT=8000
      - SAN1_WORKERS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
